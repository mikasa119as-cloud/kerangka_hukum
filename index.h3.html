<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Legal Command Center Pro - Complete Tracker with Notes</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #030712;
            --sf: #0A1120;
            --sf-hover: #0E172A;
            --sf2: #131F35;
            --ln: #1E293B;
            --ln-light: #334155;
            --tx: #F8FAFC;
            --mu: #94A3B8;
            --gold: #EAB308;
            --gold-gradient: linear-gradient(135deg, #FDE047 0%, #CA8A04 100%);
            --r: 16px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            height: 100%;
            display: flex;
            overflow: hidden;
            background: radial-gradient(circle at 10% 10%, #0F172A 0%, #030712 70%);
            color: var(--tx);
            font: 14px/1.6 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        /* Sidebar Eksekutif */
        .side {
            width: 290px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #020617, #070E1B 70%, #0B132B);
            color: #94A3B8;
            display: flex;
            flex-direction: column;
            z-index: 40;
            transition: transform .25s ease;
            border-right: 1px solid var(--ln);
        }
        .brand {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--gold-gradient);
            display: grid;
            place-items: center;
            color: #030712;
            font-size: 18px;
            box-shadow: 0 8px 25px rgba(234,179,8,.25);
        }
        .brand b { display: block; font-size: 15px; color: #fff; font-weight: 800; letter-spacing: -.01em; }
        .brand span { font-size: 11px; color: #64748B; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; }
        
        #nav { flex: 1; overflow-y: auto; padding: 16px 12px; }
        .nav-category-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748B;
            font-weight: 800;
            padding: 12px 14px 6px;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 4px;
            border: 0;
            border-radius: 12px;
            background: none;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #94A3B8;
            cursor: pointer;
            transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav i { width: 20px; text-align: center; font-size: 14px; transition: transform .2s; }
        .nav:hover { background: rgba(255,255,255,.04); color: #fff; }
        .nav:hover i { transform: scale(1.1); color: var(--gold); }
        .nav.active {
            background: linear-gradient(90deg, rgba(234,179,8,.15), rgba(234,179,8,.02));
            color: #fff;
            box-shadow: inset 3px 0 0 var(--gold);
        }
        .nav.active i { color: var(--gold); }
        .nb {
            margin-left: auto;
            min-width: 20px;
            text-align: center;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 99px;
            background: rgba(255,255,255,.08);
            color: #CBD5E1;
        }
        .sfoot { padding: 18px 20px; border-top: 1px solid rgba(255,255,255,.05); font-size: 11.5px; color: #64748B; background: rgba(0,0,0,.2); }
        .sfoot b { display: block; color: #CBD5E1; font-size: 12px; margin-bottom: 3px; }

        /* Workspace Utama */
        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 36px;
            background: rgba(10,17,32,0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--ln);
            flex-shrink: 0;
            z-index: 30;
        }
        .top h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; color: #fff; }
        .top p { font-size: 12.5px; color: var(--mu); margin-top: 2px; }
        .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

        #v { flex: 1; overflow-y: auto; padding: 32px 36px 56px; scroll-behavior: smooth; }
        #v > * + * { margin-top: 28px; }

        /* Kartu Panel & Grid */
        .pn {
            background: linear-gradient(180deg, var(--sf), #060B14);
            border: 1px solid var(--ln);
            border-radius: var(--r);
            padding: 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
            position: relative;
            overflow: hidden;
        }
        .pn::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
        }
        .pn h2 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; color: #fff; }
        .pn h2::before { content: ""; width: 4px; height: 18px; border-radius: 4px; background: var(--gold); }
        .sub { font-size: 13px; color: var(--mu); margin: 4px 0 20px; }
        
        .k { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .k div {
            position: relative;
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: var(--r);
            padding: 18px 20px;
            overflow: hidden;
            transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,.2);
        }
        .k div:hover { transform: translateY(-3px); border-color: var(--ln-light); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
        .k div::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--a, #3B82F6); }
        .k b { display: block; font-size: 26px; line-height: 1.1; font-weight: 800; margin-top: 6px; letter-spacing: -.03em; color: #fff; }
        .k span { font-size: 10.5px; color: var(--mu); text-transform: uppercase; letter-spacing: .9px; font-weight: 700; }

        .pie-charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-bottom: 28px; }
        .bar-charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 24px; margin-bottom: 28px; }

        @media(max-width: 1100px) { 
            .bar-charts-grid { grid-template-columns: 1fr; }
        }

        /* Tombol & Elemen Form */
        .btn {
            border: 1px solid var(--ln);
            background: var(--sf2);
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all .2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }
        .btn:hover { border-color: var(--ln-light); background: #1E293B; transform: translateY(-1px); }
        .btn:active { transform: scale(.97); }
        .btn.pri { background: var(--gold-gradient); color: #030712; border-color: transparent; font-weight: 800; box-shadow: 0 6px 20px rgba(234,179,8,.25); }
        .btn.pri:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn.danger { background: rgba(239,68,68,.12); color: #F87171; border-color: rgba(239,68,68,.3); }
        .btn.danger:hover { background: rgba(239,68,68,.25); border-color: rgba(239,68,68,.5); }

        .fi {
            border: 1px solid var(--ln);
            background: var(--sf2);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 13px;
            color: #fff;
            transition: all .2s;
        }
        .fi:hover { border-color: var(--ln-light); }
        .fi:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(234,179,8,.15); }
        input.fi { flex: 1; min-width: 220px; max-width: 280px; }

        /* Tabel Eksekutif */
        .tw {
            overflow: auto;
            max-height: calc(100vh - 420px);
            min-height: 320px;
            border: 1px solid var(--ln);
            border-radius: var(--r);
            background: var(--sf);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            position: sticky;
            top: 0;
            background: #050B17;
            padding: 14px 18px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .9px;
            color: var(--mu);
            border-bottom: 1px solid var(--ln);
            white-space: nowrap;
            z-index: 2;
            font-weight: 700;
        }
        td { padding: 12px 16px; border-bottom: 1px solid var(--ln); font-size: 13px; vertical-align: middle; color: #E2E8F0; }
        tbody tr:nth-child(even) td { background: rgba(255,255,255,.008); }
        tbody tr { transition: background .15s; }
        tbody tr:hover td { background: rgba(255,255,255,.03); cursor: pointer; color: #fff; }

        /* Style Catatan Tambahan di Pinggir Tabel */
        .note-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 280px;
            font-size: 11.5px;
            line-height: 1.4;
        }
        .note-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 700;
        }
        .note-tag.blocker { background: rgba(239,68,68,.15); color: #F87171; border: 1px solid rgba(239,68,68,.3); }
        .note-tag.action { background: rgba(59,130,246,.15); color: #60A5FA; border: 1px solid rgba(59,130,246,.3); }
        .doc-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(234,179,8,.12);
            color: var(--gold);
            border: 1px solid rgba(234,179,8,.3);
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            transition: all .2s;
        }
        .doc-link-btn:hover { background: rgba(234,179,8,.25); color: #fff; }

        /* Badge Status & Prioritas */
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: .3px; }
        .badge.p0 { background: rgba(239,68,68,.15); color: #F87171; border: 1px solid rgba(239,68,68,.3); box-shadow: 0 0 12px rgba(239,68,68,.15); }
        .badge.p1 { background: rgba(217,70,239,.15); color: #E879F9; border: 1px solid rgba(217,70,239,.3); }
        .badge.p2 { background: rgba(245,158,11,.15); color: #FBBF24; border: 1px solid rgba(245,158,11,.3); }
        .badge.p3 { background: rgba(100,116,139,.15); color: #94A3B8; border: 1px solid rgba(100,116,139,.3); }
        
        .badge.completed { background: rgba(16,185,129,.15); color: #34D399; border: 1px solid rgba(16,185,129,.3); box-shadow: 0 0 12px rgba(16,185,129,.15); }
        .badge.inprogress { background: rgba(59,130,246,.15); color: #60A5FA; border: 1px solid rgba(59,130,246,.3); }
        .badge.notstarted { background: rgba(148,163,184,.15); color: #CBD5E1; border: 1px solid rgba(148,163,184,.3); }
        .badge.blocked { background: rgba(239,68,68,.15); color: #F87171; border: 1px solid rgba(239,68,68,.3); }

        /* Modal Form */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-bg.on { display: flex; }
        .modal-card {
            background: linear-gradient(180deg, #0B132B, #040812);
            border: 1px solid var(--ln);
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            animation: popIn .25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header {
            padding: 22px 28px;
            border-bottom: 1px solid var(--ln);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10,17,32,0.9);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .modal-body { padding: 28px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .modal-body .full { grid-column: span 2; }
        .modal-footer { padding: 20px 28px; border-top: 1px solid var(--ln); display: flex; justify-content: space-between; align-items: center; background: rgba(5,11,23,0.8); }

        .form-group label { display: block; font-size: 11.5px; font-weight: 700; color: var(--mu); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 11px 16px;
            background: var(--bg);
            border: 1px solid var(--ln);
            border-radius: 12px;
            font-size: 13.5px;
            color: #fff;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(234,179,8,.15); }

        /* Toast Notifikasi */
        #toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translate(-50%, 24px);
            background: #0B132B;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 14px 26px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 13.5px;
            opacity: 0;
            pointer-events: none;
            transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #toast.on { opacity: 1; transform: translate(-50%, 0); }
        #toast i { color: var(--gold); }

        @media(max-width: 1024px) {
            .side { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); }
            .side.on { transform: none; }
            .modal-body { grid-template-columns: 1fr; }
            .modal-body .full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigasi -->
    <aside class="side" id="side">
        <div class="brand">
            <div class="logo"><i class="fa-solid fa-scale-balanced"></i></div>
            <div>
                <b>Command Center</b>
                <span>Executive Legal Suite</span>
            </div>
        </div>
        <div id="nav">
            <div class="nav-category-title">Menu Utama</div>
            <button class="nav active" onclick="switchTab('Dashboard Utama')"><i class="fa-solid fa-chart-pie"></i> Dashboard Utama <span id="nb-dash" class="nb">90</span></button>
            
            <div class="nav-category-title">Kerangka Hukum</div>
            <button class="nav" onclick="switchTab('Contract Management')"><i class="fa-solid fa-file-contract"></i> Contract Management <span id="nb-contract" class="nb">0</span></button>
            <button class="nav" onclick="switchTab('Compliance & Regulatory / Affairs')"><i class="fa-solid fa-shield-halved"></i> Compliance & Regulatory <span id="nb-comp" class="nb">0</span></button>
            <button class="nav" onclick="switchTab('Litigation & Dispute Resolution')"><i class="fa-solid fa-gavel"></i> Litigation & Dispute <span id="nb-lit" class="nb">0</span></button>
            <button class="nav" onclick="switchTab('Corporate Governance')"><i class="fa-solid fa-briefcase"></i> Corporate Governance <span id="nb-corp" class="nb">0</span></button>
            <button class="nav" onclick="switchTab('Risk Management')"><i class="fa-solid fa-triangle-exclamation"></i> Risk Management <span id="nb-risk" class="nb">0</span></button>
            <button class="nav" onclick="switchTab('Asset')"><i class="fa-solid fa-building"></i> Asset <span id="nb-asset" class="nb">0</span></button>
        </div>
        <div class="sfoot">
            <b id="dataCountLabel">Database Aktif</b> Catatan Kendala & Action Plan Aktif.
        </div>
    </aside>

    <!-- Konten Utama -->
    <div class="main">
        <header class="top">
            <div class="flex items-center gap-3">
                <button class="btn md:hidden" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <div>
                    <h1 id="pageTitle">Dashboard Utama</h1>
                    <p id="pageSub">Monitoring 90 berkas hukum lengkap dengan Catatan Blocker & Action Plan.</p>
                </div>
            </div>
            <div class="tools">
                <button onclick="openFormModal('add')" class="btn pri"><i class="fa-solid fa-plus"></i> Tugas Baru</button>
                <button onclick="resetDataStorage()" class="btn danger" title="Reset ke data awal"><i class="fa-solid fa-rotate-right"></i> Reset Data</button>
                <button onclick="exportToCSV()" class="btn"><i class="fa-solid fa-download"></i> Ekspor CSV</button>
                <button onclick="window.print()" class="btn"><i class="fa-solid fa-print"></i></button>
            </div>
        </header>

        <main id="v"></main>
    </div>

    <!-- Modal Form (Tambah & Edit Data) -->
    <div id="formModal" class="modal-bg">
        <div class="modal-card">
            <div class="modal-header">
                <div class="flex items-center gap-2">
                    <i id="formModalIcon" class="fa-solid fa-plus-circle text-amber-400 text-lg"></i>
                    <h3 id="formModalTitle" class="font-bold text-base">Tambah Tugas Hukum</h3>
                </div>
                <button onclick="closeFormModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="taskForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editTaskId">
                <div class="modal-body">
                    <div class="form-group full">
                        <label>Nama Tugas / Dokumen *</label>
                        <input type="text" id="inpName" required placeholder="Contoh: Pengajuan Pembuatan Somasi">
                    </div>
                    <div class="form-group">
                        <label>Work Type</label>
                        <select id="inpWorkType">
                            <option value="Harian/Ad-hoc">Harian/Ad-hoc</option>
                            <option value="Project">Project</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Unit Bisnis (Business Unit)</label>
                        <select id="inpBU">
                            <option value="PT EEN">PT EEN</option>
                            <option value="PT Eigerindo MPI">PT Eigerindo MPI</option>
                            <option value="PT KIND">PT KIND</option>
                            <option value="PT Dua Puluh Tiga">PT Dua Puluh Tiga</option>
                            <option value="PT 72425">PT 72425</option>
                            <option value="PT Eksonindo MPI">PT Eksonindo MPI</option>
                            <option value="Owner & Family">Owner & Family</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Kerangka Hukum *</label>
                        <select id="inpFramework">
                            <option value="Contract Management">Contract Management</option>
                            <option value="Compliance & Regulatory / Affairs">Compliance & Regulatory / Affairs</option>
                            <option value="Litigation & Dispute Resolution">Litigation & Dispute Resolution</option>
                            <option value="Corporate Governance">Corporate Governance</option>
                            <option value="Risk Management">Risk Management</option>
                            <option value="Asset">Asset</option>
                            <option value="Surat Keluar">Surat Keluar</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Prioritas</label>
                        <select id="inpPriority">
                            <option value="P0 - Urgent/Critical">P0 - Urgent/Critical</option>
                            <option value="P1 - High">P1 - High</option>
                            <option value="P2 - Medium" selected>P2 - Medium</option>
                            <option value="P3 - Low">P3 - Low</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="inpStatus">
                            <option value="Completed" selected>Completed</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Not Started">Not Started</option>
                            <option value="Blocked">Blocked</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tanggal Permintaan</label>
                        <input type="date" id="inpRequestDate">
                    </div>
                    <div class="form-group">
                        <label>Target Selesai</label>
                        <input type="date" id="inpTarget">
                    </div>
                    
                    <!-- Form Input Catatan Tambahan -->
                    <div class="form-group full">
                        <label>Blocker Reason (Catatan Kendala)</label>
                        <textarea id="inpBlocker" rows="2" placeholder="Tuliskan kendala / hambatan jika ada..."></textarea>
                    </div>
                    <div class="form-group full">
                        <label>Action Plan (Rencana Tindak Lanjut)</label>
                        <textarea id="inpAction" rows="2" placeholder="Tuliskan rencana penyelesaian masalah..."></textarea>
                    </div>
                    <div class="form-group full">
                        <label>Link Berkas / Drive Document</label>
                        <input type="text" id="inpDocLink" placeholder="Masukkan nama berkas / URL Drive...">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeFormModal()" class="btn">Batal</button>
                    <button type="submit" class="btn pri"><i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Data Secara Real-Time</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Detail Tugas -->
    <div id="detailModal" class="modal-bg">
        <div class="modal-card">
            <div class="modal-header">
                <div class="flex items-center gap-3">
                    <span id="detPriority" class="badge p1">P1</span>
                    <div>
                        <span id="detId" class="text-xs text-amber-400 font-mono">LEG-202605-0001</span>
                        <h3 id="detTitle" class="font-bold text-base text-white">Judul Tugas</h3>

        function getInitialData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { console.error(e); }
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultLegalData));
            return [...defaultLegalData];
        }

        let rawLegalData = getInitialData();

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(rawLegalData));
            updateSidebarBadges();
        }

        let currentTab = 'Dashboard Utama';
        let filterStatus = '';
        let filterPriority = '';
        let searchTerm = '';

        function switchTab(tab) {
            currentTab = tab;
            filterStatus = '';
            filterPriority = '';
            searchTerm = '';
            
            document.querySelectorAll('.nav').forEach(el => el.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            } else {
                const btn = document.querySelector(`.nav[onclick*="${tab}"]`);
                if (btn) btn.classList.add('active');
            }
            
            document.getElementById('pageTitle').textContent = tab;
            document.getElementById('pageSub').textContent = tab === 'Dashboard Utama' 
                ? 'Ringkasan Grafik & Status Keseluruhan 90 Berkas Excel.'
                : `Monitoring dan pengelolaan berkas untuk kerangka hukum: ${tab}.`;
            
            renderContent();
            initCharts();
        }

        function updateSidebarBadges() {
            document.getElementById('nb-dash').textContent = rawLegalData.length;
            document.getElementById('nb-contract').textContent = rawLegalData.filter(d => d.legalFramework === 'Contract Management').length;
            document.getElementById('nb-comp').textContent = rawLegalData.filter(d => d.legalFramework === 'Compliance & Regulatory / Affairs').length;
            document.getElementById('nb-lit').textContent = rawLegalData.filter(d => d.legalFramework === 'Litigation & Dispute Resolution').length;
            document.getElementById('nb-corp').textContent = rawLegalData.filter(d => d.legalFramework === 'Corporate Governance').length;
            document.getElementById('nb-risk').textContent = rawLegalData.filter(d => d.legalFramework === 'Risk Management').length;
            document.getElementById('nb-asset').textContent = rawLegalData.filter(d => d.legalFramework === 'Asset').length;
        }

        function toggleSidebar() {
            document.getElementById('side').classList.toggle('on');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastText').textContent = msg;
            t.classList.add('on');
            setTimeout(() => t.classList.remove('on'), 3000);
        }

        function resetDataStorage() {
            if (confirm("Apakah Anda ingin mereset seluruh data kembali ke data Excel awal (90 item)?")) {
                localStorage.removeItem(STORAGE_KEY);
                rawLegalData = [...defaultLegalData];
                saveToStorage();
                renderContent();
                initCharts();
                showToast("Data berhasil direset ke 90 data asli Excel.");
            }
        }

        let chartInstances = {};

        function createDoughnutChart(canvasId, labels, dataValues, backgroundColors) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            if (chartInstances[canvasId]) {
                chartInstances[canvasId].destroy();
            }

            chartInstances[canvasId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: backgroundColors,
                        borderWidth: 2,
                        borderColor: '#0A1120'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#F1F5F9',
                                font: { family: 'Plus Jakarta Sans', size: 9.5 },
                                padding: 6,
                                usePointStyle: true
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
        }

        function initCharts() {
            let data = currentTab === 'Dashboard Utama' 
                ? [...rawLegalData] 
                : rawLegalData.filter(d => d.legalFramework === currentTab);

            // 1. PIE CHARTS
            const completed = data.filter(d => d.status === 'Completed').length;
            const inProgress = data.filter(d => d.status === 'In Progress').length;
            const notStarted = data.filter(d => d.status === 'Not Started').length;
            const blocked = data.filter(d => d.status === 'Blocked').length;
            
            createDoughnutChart('statusPieChart', ['Completed', 'In Progress', 'Not Started', 'Blocked'], [completed, inProgress, notStarted, blocked], ['#10B981', '#3B82F6', '#64748B', '#EF4444']);

            const p0 = data.filter(d => d.priority.startsWith('P0')).length;
            const p1 = data.filter(d => d.priority.startsWith('P1')).length;
            const p2 = data.filter(d => d.priority.startsWith('P2')).length;
            const p3 = data.filter(d => d.priority.startsWith('P3')).length;

            createDoughnutChart('priorityPieChart', ['P0 (Urgent)', 'P1 (High)', 'P2 (Medium)', 'P3 (Low)'], [p0, p1, p2, p3], ['#EF4444', '#D946EF', '#F59E0B', '#64748B']);

            if (currentTab === 'Dashboard Utama') {
                const fwMap = {};
                data.forEach(d => { fwMap[d.legalFramework] = (fwMap[d.legalFramework] || 0) + 1; });
                createDoughnutChart('frameworkPieChart', Object.keys(fwMap), Object.values(fwMap), ['#3B82F6', '#10B981', '#F59E0B', '#D946EF', '#06B6D4', '#84CC16', '#A855F7']);

                const buMap = {};
                data.forEach(d => { buMap[d.businessUnit] = (buMap[d.businessUnit] || 0) + 1; });
                createDoughnutChart('buPieChart', Object.keys(buMap), Object.values(buMap), ['#6366F1', '#EC4899', '#14B8A6', '#F97316', '#84CC16', '#A855F7', '#EAB308', '#06B6D4']);

                // 2. BAR CHARTS BUSINESS UNIT
                const buList = Object.keys(buMap);
                const buStatusData = { 'Completed': [], 'In Progress': [], 'Not Started': [], 'Blocked': [] };

                buList.forEach(bu => {
                    const buItems = data.filter(d => d.businessUnit === bu);
                    buStatusData['Completed'].push(buItems.filter(d => d.status === 'Completed').length);
                    buStatusData['In Progress'].push(buItems.filter(d => d.status === 'In Progress').length);
                    buStatusData['Not Started'].push(buItems.filter(d => d.status === 'Not Started').length);
                    buStatusData['Blocked'].push(buItems.filter(d => d.status === 'Blocked').length);
                });

                const ctxH = document.getElementById('buHorizontalBarChart');
                if (ctxH) {
                    if (chartInstances['buHorizontalBarChart']) chartInstances['buHorizontalBarChart'].destroy();
                    chartInstances['buHorizontalBarChart'] = new Chart(ctxH, {
                        type: 'bar',
                        data: {
                            labels: buList,
                            datasets: [
                                { label: 'Completed', data: buStatusData['Completed'], backgroundColor: '#10B981' },
                                { label: 'In Progress', data: buStatusData['In Progress'], backgroundColor: '#3B82F6' },
                                { label: 'Not Started', data: buStatusData['Not Started'], backgroundColor: '#64748B' },
                                { label: 'Blocked', data: buStatusData['Blocked'], backgroundColor: '#EF4444' }
                            ]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: { stacked: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94A3B8' } },
                                y: { stacked: true, grid: { display: false }, ticks: { color: '#F8FAFC', font: { weight: '600', size: 10 } } }
                            },
                            plugins: {
                                legend: { position: 'bottom', labels: { color: '#F1F5F9', font: { size: 10 } } }
                            }
                        }
                    });
                }

                const buPriorityData = { 'P0': [], 'P1': [], 'P2': [], 'P3': [] };

                buList.forEach(bu => {
                    const buItems = data.filter(d => d.businessUnit === bu);
                    buPriorityData['P0'].push(buItems.filter(d => d.priority.startsWith('P0')).length);
                    buPriorityData['P1'].push(buItems.filter(d => d.priority.startsWith('P1')).length);
                    buPriorityData['P2'].push(buItems.filter(d => d.priority.startsWith('P2')).length);
                    buPriorityData['P3'].push(buItems.filter(d => d.priority.startsWith('P3')).length);
                });

                const ctxV = document.getElementById('buVerticalBarChart');
                if (ctxV) {
                    if (chartInstances['buVerticalBarChart']) chartInstances['buVerticalBarChart'].destroy();
                    chartInstances['buVerticalBarChart'] = new Chart(ctxV, {
                        type: 'bar',
                        data: {
                            labels: buList,
                            datasets: [
                                { label: 'P0 (Urgent)', data: buPriorityData['P0'], backgroundColor: '#EF4444' },
                                { label: 'P1 (High)', data: buPriorityData['P1'], backgroundColor: '#D946EF' },
                                { label: 'P2 (Medium)', data: buPriorityData['P2'], backgroundColor: '#F59E0B' },
                                { label: 'P3 (Low)', data: buPriorityData['P3'], backgroundColor: '#64748B' }
                            ]
                        },
                        options: {
                            indexAxis: 'x',
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: { stacked: false, grid: { display: false }, ticks: { color: '#F8FAFC', font: { weight: '600', size: 9.5 } } },
                                y: { stacked: false, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94A3B8' } }
                            },
                            plugins: {
                                legend: { position: 'bottom', labels: { color: '#F1F5F9', font: { size: 10 } } }
                            }
                        }
                    });
                }
            }
        }

        function handleSearch(val) {
            searchTerm = val.toLowerCase();
            renderContent();
        }

        function openFormModal(mode, taskId = null) {
            const modal = document.getElementById('formModal');
            const title = document.getElementById('formModalTitle');
            const icon = document.getElementById('formModalIcon');
            
            document.getElementById('taskForm').reset();
            document.getElementById('editTaskId').value = '';

            if (mode === 'edit' && taskId) {
                const item = rawLegalData.find(d => d.taskId === taskId);
                if (!item) return;
                title.textContent = `Edit Tugas: ${item.taskId}`;
                icon.className = "fa-solid fa-pen-to-square text-amber-400 text-lg";
                
                document.getElementById('editTaskId').value = item.taskId;
                document.getElementById('inpName').value = item.taskName;
                document.getElementById('inpWorkType').value = item.workType;
                document.getElementById('inpBU').value = item.businessUnit;
                document.getElementById('inpFramework').value = item.legalFramework;
                document.getElementById('inpPriority').value = item.priority;
                document.getElementById('inpStatus').value = item.status;
                document.getElementById('inpRequestDate').value = item.requestDate;
                document.getElementById('inpTarget').value = item.targetCompletion;
                document.getElementById('inpBlocker').value = item.blockerReason !== '-' ? item.blockerReason : '';
                document.getElementById('inpAction').value = item.actionPlan !== '-' ? item.actionPlan : '';
                document.getElementById('inpDocLink').value = item.docLink !== '-' ? item.docLink : '';
            } else {
                title.textContent = 'Tambah Tugas Hukum Baru';
                icon.className = "fa-solid fa-plus-circle text-amber-400 text-lg";
                document.getElementById('inpRequestDate').value = new Date().toISOString().split('T')[0];
            }
            modal.classList.add('on');
        }

        function closeFormModal() {
            document.getElementById('formModal').classList.remove('on');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editTaskId').value;
            
            const taskData = {
                workType: document.getElementById('inpWorkType').value,
                taskName: document.getElementById('inpName').value,
                businessUnit: document.getElementById('inpBU').value,
                legalFramework: document.getElementById('inpFramework').value,
                priority: document.getElementById('inpPriority').value,
                status: document.getElementById('inpStatus').value,
                requestDate: document.getElementById('inpRequestDate').value,
                targetCompletion: document.getElementById('inpTarget').value || '-',
                blockerReason: document.getElementById('inpBlocker').value.trim() || '-',
                actionPlan: document.getElementById('inpAction').value.trim() || '-',
                docLink: document.getElementById('inpDocLink').value.trim() || '-'
            };

            if (editId) {
                const idx = rawLegalData.findIndex(d => d.taskId === editId);
                if (idx !== -1) {
                    rawLegalData[idx] = { ...rawLegalData[idx], ...taskData };
                    showToast(`Tugas ${editId} berhasil diperbarui!`);
                }
            } else {
                const newIdNum = rawLegalData.length + 1;
                const newItem = {
                    taskId: `LEG-202606-${String(newIdNum).padStart(4, '0')}`,
                    ...taskData
                };
                rawLegalData.unshift(newItem);
                showToast('Tugas baru berhasil ditambahkan!');
            }

            saveToStorage();
            closeFormModal();
            renderContent();
            initCharts();
            closeDetailModal();
        }

        function deleteTask(taskId) {
            if (confirm(`Apakah Anda yakin ingin menghapus tugas ${taskId}?`)) {
                const idx = rawLegalData.findIndex(d => d.taskId === taskId);
                if (idx !== -1) {
                    rawLegalData.splice(idx, 1);
                    saveToStorage();
                    renderContent();
                    initCharts();
                    showToast(`Tugas ${taskId} berhasil dihapus.`);
                    closeDetailModal();
                }
            }
        }

        function openDetailModal(taskId) {
            const item = rawLegalData.find(d => d.taskId === taskId);
            if (!item) return;

            document.getElementById('detId').textContent = item.taskId;
            document.getElementById('detTitle').textContent = item.taskName;
            document.getElementById('detPriority').textContent = item.priority;
            document.getElementById('detPriority').className = `badge ${item.priority.substring(0,2).toLowerCase()}`;
            document.getElementById('detWorkType').textContent = item.workType;
            document.getElementById('detBU').textContent = item.businessUnit;
            document.getElementById('detStatus').textContent = item.status;
            document.getElementById('detFw').textContent = item.legalFramework;
            document.getElementById('detReqDate').textContent = item.requestDate;
            document.getElementById('detTarget').textContent = item.targetCompletion;
            document.getElementById('detBlocker').textContent = item.blockerReason || '-';
            document.getElementById('detAction').textContent = item.actionPlan || '-';
            document.getElementById('detDocLink').textContent = item.docLink || '-';

            document.getElementById('btnEditFromDetail').setAttribute('onclick', `closeDetailModal(); openFormModal('edit', '${item.taskId}')`);
            document.getElementById('btnDeleteFromDetail').setAttribute('onclick', `deleteTask('${item.taskId}')`);

            document.getElementById('detailModal').classList.add('on');
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.remove('on'); }

        function exportToCSV() {
            let csv = "Task ID,Work Type,Task Name,Business Unit,Legal Framework,Priority,Status,Request Date,Target Completion,Blocker Reason,Action Plan,Doc Link\n";
            const exportData = currentTab === 'Dashboard Utama' 
                ? rawLegalData 
                : rawLegalData.filter(d => d.legalFramework === currentTab);
            
            exportData.forEach(d => {
                csv += `"${d.taskId}","${d.workType}","${d.taskName}","${d.businessUnit}","${d.legalFramework}","${d.priority}","${d.status}","${d.requestDate}","${d.targetCompletion}","${d.blockerReason}","${d.actionPlan}","${d.docLink}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `${currentTab.replace(/[^a-zA-Z0-9]/g, '_')}_Export.csv`);
            a.click();
            showToast('Data berhasil diekspor ke CSV.');
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateSidebarBadges();
            switchTab('Dashboard Utama');
        });
    </script>
</body>
</html>
