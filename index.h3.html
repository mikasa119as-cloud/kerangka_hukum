<style>
:root{--bg:#050816;--sf:#0B1026;--sf2:#121A38;--ln:#1C2547;--ln2:#2B3766;--tx:#E8ECFF;--mu:#8E9ACB;--ac:#8B9CFF;--ac-ink:#050816;--side:#040612;--ok:#34D399;--info:#7DB2FF;--warn:#FBBF24;--bad:#FB7185;--idle:#B4BEE0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;overflow:hidden;background:radial-gradient(1100px 560px at 12% -8%,#16215A 0%,rgba(22,33,90,0) 62%),radial-gradient(900px 500px at 100% 100%,#0E1740 0%,rgba(14,23,64,0) 60%),var(--bg);background-attachment:fixed;color:var(--tx);font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.logo{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:linear-gradient(135deg,#A5B4FF,#6D7CF0);display:grid;place-items:center;color:#050816;box-shadow:0 8px 25px rgba(139,156,255,.3)}

#nav{flex:1;overflow-y:auto;padding:16px 12px}
.grp{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7C8AB8;font-weight:800;padding:12px 14px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;margin-bottom:4px;border:0;border-radius:12px;background:none;text-align:left;font-size:13px;font-weight:600;color:#A5B2D6;transition:all .2s cubic-bezier(.16,1,.3,1)}
.nav svg{width:18px;height:18px;flex-shrink:0;transition:transform .2s}

.nav.on svg{color:var(--ac)}
.nav .n{margin-left:auto;min-width:20px;text-align:center;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px;background:rgba(255,255,255,.08);color:#CBD5F5}
.sfoot{padding:18px 20px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:#7C8AB8;background:rgba(0,0,0,.25)}

.scrim{display:none;position:fixed;inset:0;background:rgba(2,6,23,.7);z-index:55}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 28px;background:rgba(11,16,38,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}

.tl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hb{display:none}
#v{flex:1;overflow-y:auto;padding:24px 28px 56px}

.btn{border:1px solid var(--ln2);background:var(--sf2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .1s}
.btn:hover{border-color:var(--ac)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#A5B4FF,#7C8CF5);color:var(--ac-ink);border-color:transparent;font-weight:800}
.btn.dg{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--ln2);background:var(--sf2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.sync.live i{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
.sync.saving i{background:var(--warn);animation:pl 1s infinite}
.sync.local i,.sync.err i{background:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{text-align:left;background:var(--sf);border:1px solid var(--ln);border-top:3px solid var(--a);border-radius:12px;padding:14px 16px;transition:border-color .15s,transform .15s}
.kpi:hover{transform:translateY(-2px);border-color:var(--a)}
.kpi.on{background:var(--sf2);border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.kpi span{display:block;font-size:12px;color:var(--mu);font-weight:600}
.kpi b{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--a)}
.pn{background:linear-gradient(180deg,#0D1330,var(--sf));border:1px solid var(--ln);border-radius:14px;padding:20px}
.pn h2{font-size:15px;font-weight:700}
.pn .sub{font-size:12.5px;color:var(--mu);margin:2px 0 12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.cv{position:relative;height:200px}
.cv.t{height:300px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fi{border:1px solid var(--ln2);background:var(--sf2);border-radius:10px;padding:8px 12px;font-size:13px;min-width:0}
.fi:focus{border-color:var(--ac);outline:none}
input.fi{flex:1;min-width:200px;max-width:320px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:3px 6px 3px 10px;border-radius:99px;background:rgba(139,156,255,.14);border:1px solid rgba(139,156,255,.4)}
.chip button{border:0;background:none;font-size:14px;line-height:1;color:var(--mu)}
.tw{overflow:auto;border:1px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse;text-align:left}
th{position:sticky;top:0;background:var(--sf2);padding:11px 14px;font-size:12px;color:var(--mu);border-bottom:1px solid var(--ln);white-space:nowrap;z-index:2}
th[data-s]{cursor:pointer;user-select:none}
th[data-s]:hover{color:var(--tx)}
td{padding:10px 14px;border-bottom:1px solid var(--ln);font-size:13px;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(148,163,184,.08)}
.id{font-family:ui-monospace,monospace;font-size:12px;color:var(--ac);font-weight:700;white-space:nowrap}
.bd{display:inline-flex;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid;white-space:nowrap}
.p0{color:var(--bad);border-color:currentColor}.p1{color:#E879F9;border-color:currentColor}.p2{color:var(--warn);border-color:currentColor}.p3{color:var(--idle);border-color:currentColor}
.s-Completed{color:var(--ok)}.s-In{color:var(--info)}.s-Not{color:var(--idle)}.s-Blocked{color:var(--bad)}
.ss{border-radius:99px;font-weight:700;font-size:12px;padding:3px 8px;background:var(--sf2);border:1px solid var(--ln2)}
.nt{font-size:12px;max-width:280px;color:var(--mu)}
.nt b{font-weight:700}.nt .b{color:var(--bad)}.nt .a{color:var(--info)}
.late{color:var(--bad);font-weight:700;font-size:12px}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.mb{position:fixed;inset:0;background:rgba(2,6,23,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mb.on{display:flex}
.mc{background:var(--sf);border:1px solid var(--ln2);border-radius:16px;width:100%;max-width:720px;max-height:90vh;overflow-y:auto}
.mc.s{max-width:420px}
.mh,.mf{padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mh{border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--sf)}
.mf{border-top:1px solid var(--ln)}
.mh h3{font-size:16px}
.mbd{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mbd .f{grid-column:span 2}
.fg label,.dl dt{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--ln2);border-radius:10px;font-size:13.5px}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--ac);outline:none}
.dl dd{font-size:13.5px;font-weight:600;word-break:break-word}
.tt{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--sf2);border:1px solid var(--ac);padding:11px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200}
.tt{display:flex;align-items:center;gap:12px}.tt.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media(max-width:1000px){.side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}.side.on{transform:none}.side.on~.scrim{display:block}.hb{display:inline-flex}.top,#v{padding-left:16px;padding-right:16px}.mbd{grid-template-columns:1fr}.mbd .f{grid-column:span 1}}
.pg{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px;font-size:12.5px;color:var(--mu)}
tr:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
@media(max-width:700px){thead{display:none}table,tbody,tr,td{display:block;width:100%}tr{padding:12px 14px;border-bottom:1px solid var(--ln)}td{border:0;padding:3px 0}td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mu);font-weight:700}.nt{max-width:none}}
@media print{.side,.tl,.bar,.scrim{display:none!important}body{overflow:visible;display:block}#v{overflow:visible}.tw{max-height:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function loadLocal(){try{const r=localStorage.getItem(LS);return r===null?null:JSON.parse(r)}catch(e){return[]}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(tasks))}catch(e){}}
async function persist(t,del,patch){
  const i=tasks.findIndex(x=>x.taskId===t.taskId);
  if(del){if(i>-1)tasks.splice(i,1)}else if(i>-1)tasks[i]=t;else tasks.push(t);
  if(!window._nb)refresh();
  if(!db){saveLocal();return true}
  setSync('saving','Menyimpan...');
  try{const r=db.doc('tasks/'+t.taskId);if(del)await r.delete();else if(patch)await r.update(patch);else await r.set(t);setSync('live','Tersinkron real-time');return true}
  catch(e){setSync('err','Gagal menyimpan');toast('Gagal menyimpan: '+(e&&e.message||'coba lagi'));return false}
}

async function init(){
  buildNav();buildTab();
  let user=null;
  try{user=window.claude&&await claude.use('user')}catch(e){}
  if(user&&user.can){const w=user.can('data.write');if(w===false)canWrite=false}
  try{db=window.claude&&await claude.use('db')}catch(e){db=null}
  if(!db){const sv=loadLocal();if(sv===null){tasks=SEED.map(t=>({...t}));saveLocal()}else tasks=sv;setSync('live','Tersimpan otomatis di browser');window.addEventListener('storage',ev=>{if(ev.key===LS){tasks=loadLocal()||[];refresh()}});refresh();return}
  db.collection('tasks').onSnapshot(s=>{
    tasks=s.docs.map(d=>d.data());
    setSync(s.metadata.hasPendingWrites?'saving':'live',s.metadata.hasPendingWrites?'Menyimpan...':'Tersinkron real-time');
    refresh();
  },e=>setSync('err','Koneksi terputus'));
  if(!canWrite){$('#add').disabled=true;toast('Anda hanya bisa melihat data')}
}

function inTab(){return tab==='all'?tasks:tasks.filter(t=>t.legalFramework===tab)}
const isLate=t=>t.status!=='Completed'&&/^\d{4}-\d\d-\d\d$/.test(t.targetCompletion)&&t.targetCompletion<new Date().toISOString().slice(0,10);
function filtered(){
  let d=inTab();
  if(f.status)d=d.filter(t=>t.status===f.status);
  if(f.pr)d=d.filter(t=>t.priority.startsWith(f.pr));
  if(f.bu)d=d.filter(t=>t.businessUnit===f.bu);
  if(f.late)d=d.filter(isLate);
  if(f.q){const q=f.q.toLowerCase();d=d.filter(t=>[t.taskName,t.taskId,t.businessUnit,t.blockerReason,t.actionPlan].some(x=>String(x||'').toLowerCase().includes(q)))}
  const o=x=>sort.k==='status'?ST.indexOf(x.status):x[sort.k],em=v=>v==null||v==='-'||v==='';
  return d.sort((a,b)=>{const x=o(a),y=o(b);if(em(x)||em(y))return em(x)&&em(y)?0:em(x)?1:-1;return(x>y?1:x<y?-1:0)*sort.d});
}

/* ---------- form, detail, hapus ---------- */
let lastFocus=null;
const open=id=>{lastFocus=document.activeElement;const m=$('#'+id);m.classList.add('on');m.setAttribute('role','dialog');m.setAttribute('aria-modal','true')},shut=()=>{const w=document.querySelector('.mb.on');document.querySelectorAll('.mb.on').forEach(m=>m.classList.remove('on'));if(w&&lastFocus&&lastFocus.focus)lastFocus.focus()};
function toast(m,act,lab){const t=$('#tt');t.textContent='';const p=document.createElement('span');p.textContent=m;t.append(p);if(act){const b=document.createElement('button');b.className='btn sm';b.textContent=lab;b.onclick=()=>{act();t.classList.remove('on')};t.append(b)}t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),act?6000:2800)}
const val=id=>$('#'+id).value;
function nextId(){
  const ym=new Date().toISOString().slice(0,7).replace('-','');
  const mx=tasks.reduce((m,t)=>Math.max(m,parseInt(String(t.taskId).split('-')[2])||0),0);
  return`LEG-${ym}-${String(mx+1).padStart(4,'0')}`;
}
function openForm(id){
  $('#form').reset();$('#fId').value='';$('#form').dataset.dirty='';$('#form').dataset.warn='';
  $('#fBu').innerHTML=BUS.map(x=>`<option>${h(x)}</option>`).join('');
  $('#fFw').innerHTML=FW.map(x=>`<option>${h(x)}</option>`).join('');
  const t=id&&tasks.find(x=>x.taskId===id);
  if(t){$('#fmT').textContent='Edit '+t.taskId;$('#fId').value=t.taskId;$('#fId').dataset.base=t.updatedAt||'';
    [['fName','taskName'],['fWt','workType'],['fBu','businessUnit'],['fFw','legalFramework'],['fPr','priority'],['fSt','status']].forEach(([a,b])=>$('#'+a).value=t[b]);
    $('#fRd').value=/^\d/.test(t.requestDate)?t.requestDate:'';$('#fTg').value=/^\d/.test(t.targetCompletion)?t.targetCompletion:'';
    $('#fBl').value=dash(t.blockerReason)?'':t.blockerReason;$('#fAc').value=dash(t.actionPlan)?'':t.actionPlan;$('#fDl').value=dash(t.docLink)?'':t.docLink;
  }else{$('#fmT').textContent='Tugas baru';$('#fRd').value=new Date().toISOString().slice(0,10);if(tab!=='all')$('#fFw').value=tab}
  shut();open('fm');$('#fName').focus();
}
function openDetail(id){
  const t=tasks.find(x=>x.taskId===id);if(!t)return;
  $('#dId').textContent=t.taskId;$('#dT').textContent=t.taskName;
  const r=[['Jenis pekerjaan',t.workType],['Unit bisnis',t.businessUnit],['Status',t.status],['Prioritas',t.priority],['Kerangka hukum',t.legalFramework],['Tanggal permintaan',t.requestDate],['Target selesai',t.targetCompletion],['Kendala',t.blockerReason,1],['Rencana tindak lanjut',t.actionPlan,1],['Berkas',t.docLink,1],['Terakhir diubah',t.updatedAt?new Date(t.updatedAt).toLocaleString('id-ID'):'-']];
  $('#dBody').innerHTML=r.map(([a,b,w])=>`<div class="${w?'f':''}"><dt>${a}</dt><dd>${h(dash(b)?'-':b)}</dd></div>`).join('');
  $('#dEdit').onclick=()=>openForm(id);$('#dEdit').disabled=$('#dDel').disabled=!canWrite;
  $('#dDel').onclick=()=>askDel(id);shut();open('dm');
}
function askDel(id){
  const t=tasks.find(x=>x.taskId===id);if(!t)return;
  $('#cT').textContent=`${t.taskId} - ${t.taskName} akan dihapus untuk semua orang yang membuka halaman ini.`;
  $('#cOk').onclick=()=>{persist(t,true);shut();toast('Tugas dihapus',()=>persist(t),'Urungkan')};shut();open('cm');
}
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();
  const id=val('fId'),old=id&&tasks.find(x=>x.taskId===id);
  const t={...(old||{}),taskId:id||await freshId(),taskName:val('fName').trim(),workType:val('fWt'),businessUnit:val('fBu'),legalFramework:val('fFw'),priority:val('fPr'),status:val('fSt'),requestDate:val('fRd')||'-',targetCompletion:val('fTg')||'-',blockerReason:val('fBl').trim()||'-',actionPlan:val('fAc').trim()||'-',docLink:val('fDl').trim()||'-'};
  if(!t.taskName)return;
  if(/^\d/.test(t.requestDate)&&/^\d/.test(t.targetCompletion)&&t.targetCompletion<t.requestDate){toast('Target selesai tidak boleh sebelum tanggal permintaan');return}
  if(t.status==='Blocked'&&dash(t.blockerReason)){toast('Isi kendala (blocker) untuk status Blocked');$('#fBl').focus();return}
  if(id){
    if(!old){toast('Tugas ini sudah dihapus orang lain');shut();return}
    if((old.updatedAt||'')!==($('#fId').dataset.base||'')){toast('Data ini diubah orang lain saat Anda mengedit',()=>openForm(id),'Muat ulang');return}
    const patch={};for(const k in t)if(t[k]!==old[k])patch[k]=t[k];
    if(!Object.keys(patch).length){toast('Tidak ada perubahan');shut();return}
    patch.updatedAt=t.updatedAt=new Date().toISOString();
    await persist(t,false,patch);shut();toast('Perubahan disimpan')
  }else{t.updatedAt=new Date().toISOString();await persist(t);shut();toast('Tugas ditambahkan')}
});

/* ---------- CSV ---------- */
async function exportCsv(){
  const hd=['taskId','workType','taskName','businessUnit','legalFramework','priority','status','requestDate','targetCompletion','blockerReason','actionPlan','docLink'];
  const q=v=>{v=String(v??'');if(/^[=+@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
  const csv='\ufeff'+hd.join(',')+'\n'+filtered().map(t=>hd.map(k=>q(t[k])).join(',')).join('\n');
  const name=(tab==='all'?'semua-tugas':tab.replace(/[^a-z0-9]+/gi,'-').toLowerCase())+'.csv';
  try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data:csv});toast('CSV siap disimpan');return}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();toast('CSV diunduh');
}

/* ---------- impor excel ---------- */
const nz=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,''),clean=v=>String(v??'').replace(/\s+/g,' ').trim();
const HD={taskId:['taskid','id','noid','nomor'],workType:['worktype','jenispekerjaan','tipe'],taskName:['taskname','taskdocumentname','taskdocument','namatugas','namadokumen','tugas','documentname'],businessUnit:['businessunit','unitbisnis','bu','unit','entitas'],legalFramework:['legalframework','kerangkahukum','framework','kategori'],priority:['priority','prioritas'],status:['status'],requestDate:['requestdate','tanggalpermintaan','tglpermintaan'],targetCompletion:['targetcompletion','targetselesai','target','deadline'],blockerReason:['blockerreason','blocker','kendala'],actionPlan:['actionplan','rencanatindaklanjut','tindaklanjut'],docLink:['doclink','documentlink','linkberkas','berkas','link','tautan']};
const mapFw=v=>{const k=nz(v);const m=k&&[['contract','Contract Management'],['compliance','Compliance & Regulatory / Affairs'],['regulatory','Compliance & Regulatory / Affairs'],['litigation','Litigation & Dispute Resolution'],['dispute','Litigation & Dispute Resolution'],['governance','Corporate Governance'],['risk','Risk Management'],['asset','Asset'],['suratkeluar','Surat Keluar']].find(a=>k.includes(a[0]));return m?m[1]:null};
const mapPr=v=>{const s=clean(v),m=s.match(/p\s*([0-3])/i);if(m)return['P0 - Urgent/Critical','P1 - High','P2 - Medium','P3 - Low'][m[1]];const k=nz(s);return/urgent|critical|darurat/.test(k)?'P0 - Urgent/Critical':/high|tinggi/.test(k)?'P1 - High':/medium|sedang/.test(k)?'P2 - Medium':/low|rendah/.test(k)?'P3 - Low':null};
const mapSt=v=>{const k=nz(v);return/notstart|belum/.test(k)?'Not Started':/progress|berjalan|proses/.test(k)?'In Progress':/block|terblokir|terhambat/.test(k)?'Blocked':/complet|selesai|done/.test(k)?'Completed':null};
const mapDt=v=>{let y,m,d,x;if(typeof v==='number'){const p=XLSX.SSF.parse_date_code(v);if(!p)return null;y=p.y;m=p.m;d=p.d}else{const s=clean(v);if(!s||s==='-')return'-';if(x=s.match(/^(\d{4})-(\d{2})-(\d{2})/)){y=+x[1];m=+x[2];d=+x[3]}else if(x=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/)){d=+x[1];m=+x[2];y=+x[3]}else return null}
  const t=new Date(Date.UTC(y,m-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:null};
const keyOf=x=>[nz(x.taskName),nz(x.businessUnit),nz(x.legalFramework),x.requestDate].join('|');
function parseSheet(rows,sheet,seen){
  const hi=rows.findIndex((r,i)=>i<15&&r.filter(c=>Object.values(HD).some(a=>a.includes(nz(c)))).length>=3);
  if(hi<0)return{err:'header kolom tidak dikenali'};
  const col={};rows[hi].forEach((c,i)=>{for(const k in HD)if(col[k]==null&&HD[k].includes(nz(c)))col[k]=i});
  const sheetFw=mapFw(sheet),need=['taskName','businessUnit','priority','status'].concat(sheetFw?[]:['legalFramework']),miss=need.filter(k=>col[k]==null);
  if(miss.length)return{err:'kolom wajib tidak ada: '+miss.join(', ')};
  const out=[],issues=[];
  rows.slice(hi+1).forEach((r,i)=>{
    if(r.every(c=>clean(c)===''))return;
    const n=hi+i+2,g=k=>col[k]==null?'':r[col[k]],bad=[];
    const t={taskId:clean(g('taskId')),workType:/project/i.test(g('workType'))?'Project':'Harian/Ad-hoc',taskName:clean(g('taskName')),businessUnit:BUS.find(b=>nz(b)===nz(g('businessUnit'))),legalFramework:col.legalFramework==null?sheetFw:mapFw(g('legalFramework')),priority:mapPr(g('priority')),status:mapSt(g('status')),requestDate:mapDt(g('requestDate')),targetCompletion:mapDt(g('targetCompletion')),blockerReason:clean(g('blockerReason'))||'-',actionPlan:clean(g('actionPlan'))||'-',docLink:clean(g('docLink'))||'-'};
    if(!t.taskName)bad.push('nama tugas kosong');
    if(t.taskId&&!/^[A-Za-z0-9_.-]+$/.test(t.taskId))bad.push('ID tidak valid "'+t.taskId+'"');
    if(!t.businessUnit)bad.push('unit bisnis tidak dikenal "'+clean(g('businessUnit'))+'"');
    if(!t.legalFramework)bad.push('kerangka hukum tidak dikenal "'+clean(g('legalFramework'))+'"');
    if(!t.priority)bad.push('prioritas tidak dikenal "'+clean(g('priority'))+'"');
    if(!t.status)bad.push('status tidak dikenal "'+clean(g('status'))+'"');
    if(t.requestDate===null)bad.push('tanggal permintaan tidak valid');
    if(t.targetCompletion===null)bad.push('target selesai tidak valid');
    if(/^\d/.test(t.requestDate)&&/^\d/.test(t.targetCompletion)&&t.targetCompletion<t.requestDate)bad.push('target sebelum tanggal permintaan');
    if(bad.length){issues.push(`${sheet} baris ${n}: ${bad.join('; ')}`);return}
    const sk=t.taskId||keyOf(t);
    if(seen.has(sk)||seen.has(keyOf(t))){issues.push(`${sheet} baris ${n}: duplikat di file, dilewati`);return}
    seen.add(sk);seen.add(keyOf(t));
    const ex=(t.taskId&&tasks.find(x=>x.taskId===t.taskId))||tasks.find(x=>keyOf(x)===keyOf(t));
    if(ex&&seen.has('M:'+ex.taskId)){issues.push(`${sheet} baris ${n}: menunjuk ke data ${ex.taskId} yang sudah dipakai baris lain, dilewati`);return}
    if(ex){seen.add('M:'+ex.taskId);const patch={};for(const k in HD)if(k!=='taskId'&&t[k]!=='-'&&t[k]!==ex[k])patch[k]=t[k];out.push({type:Object.keys(patch).length?'upd':'same',t:ex,patch})}
    else out.push({type:'new',t})
  });
  return{rows:out,issues}
}
function showImport(p,errs){
  const c=k=>p.rows.filter(x=>x.type===k).length,n=c('new')+c('upd');
  $('#imB').innerHTML=(p.rows.length||p.issues.length?`<div class="kpis" style="margin-bottom:12px">${[['Baru',c('new'),'#10B981'],['Diperbarui',c('upd'),'#3B82F6'],['Sama (dilewati)',c('same'),'#94A3B8'],['Bermasalah',p.issues.length,'#EF4444']].map(a=>`<div class="kpi" style="--a:${a[2]}"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}</div>`:'')
   +(p.issues.length?`<p class="sub">Baris ini tidak diimpor. Perbaiki di Excel lalu impor ulang:</p><ul style="font-size:12.5px;padding-left:18px;max-height:180px;overflow:auto">${p.issues.slice(0,60).map(i=>`<li>${h(i)}</li>`).join('')}</ul>`:'')
   +(errs.length?`<p class="sub">Sheet dilewati: ${h(errs.join(' | '))}</p>`:'')
   +(n?`<p class="sub">Data dicocokkan lewat ID, atau lewat nama + unit + kerangka + tanggal permintaan, jadi tidak ada data ganda. Sel kosong tidak menghapus data yang sudah ada. Kerangka hukum menentukan menu sidebar tempat data muncul.</p>`:'');
  const ok=$('#imOk');ok.textContent=n?`Impor ${n} data`:'Tidak ada yang bisa diimpor';ok.disabled=!n;ok.onclick=()=>applyImport(p);shut();open('im')
}
async function applyImport(p){
  const ok=$('#imOk');ok.disabled=true;let nn=0,nu=0,fail=0;window._nb=true;
  try{for(const x of p.rows){
    if(x.type==='same')continue;const u=new Date().toISOString();let r;
    if(x.type==='upd'){r=await persist({...x.t,...x.patch,updatedAt:u},false,{...x.patch,updatedAt:u});nu++}
    else{const id=x.t.taskId||await freshId();r=await persist({...x.t,taskId:id,updatedAt:u});nn++}
    if(!r)fail++}}
  finally{window._nb=false;refresh();shut()}
  toast(`Impor selesai: ${nn} baru, ${nu} diperbarui${fail?`, ${fail} gagal disimpan`:''}`)
}
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  if(typeof XLSX==='undefined'){toast('Pustaka Excel gagal dimuat. Periksa koneksi internet.');return}
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),seen=new Set(),all={rows:[],issues:[]},errs=[];
    wb.SheetNames.forEach(n=>{const r=parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:true}),n,seen);if(r.err)errs.push(n+': '+r.err);else{all.rows.push(...r.rows);all.issues.push(...r.issues)}});
    showImport(all,errs)
  }catch(err){toast('File tidak bisa dibaca. Gunakan .xlsx, .xls, atau .csv.')}
};
$('#form').addEventListener('input',()=>{$('#form').dataset.dirty='1'});
function tryShut(){const fr=$('#form');if($('#fm').classList.contains('on')&&fr.dataset.dirty&&!fr.dataset.warn){fr.dataset.warn='1';toast('Ada perubahan belum disimpan. Tutup lagi untuk membuang.');return}shut()}

/* ---------- event ---------- */
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);
  let el;
  if(g('[data-stop]')&&!g('[data-ed],[data-dl]'))return;
  if(el=g('[data-tab]'))setTab(el.dataset.tab);
  else if(el=g('[data-kpi]')){const k=el.dataset.kpi;if(k==='late'){f.late=!f.late;f.status=''}else{f.late=false;f.status=(k===f.status||k==='')?'':k}refresh()}
  else if(el=g('[data-x]')){const k=el.dataset.x;if(k==='all')f={status:'',pr:'',bu:'',q:'',late:false};else f[k]=k==='late'?false:'';if(k==='q'||k==='all')$('#q').value='';refresh()}
  else if(el=g('[data-ed]'))openForm(el.dataset.ed);
  else if(el=g('[data-dl]'))askDel(el.dataset.dl);
  else if(el=g('[data-pg]')){page+=+el.dataset.pg;refresh();$('#cnt').scrollIntoView({behavior:'smooth',block:'nearest'})}
  else if(el=g('th[data-s]')){sort=sort.k===el.dataset.s?{k:sort.k,d:-sort.d}:{k:el.dataset.s,d:1};refresh()}
  else if(el=g('tr[data-id]'))openDetail(el.dataset.id);
  else if(g('[data-close]')||e.target.classList.contains('mb'))tryShut();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fs')f.status=t.value,f.late=false,refresh();
  else if(t.id==='fp')f.pr=t.value,refresh();
  else if(t.id==='fb')f.bu=t.value,refresh();
  else if(t.dataset.qs){const x=tasks.find(k=>k.taskId===t.dataset.qs);if(x){if(t.value==='Blocked'&&dash(x.blockerReason)){openForm(x.taskId);$('#fSt').value='Blocked';$('#fBl').focus();toast('Isi kendala untuk status Blocked');refresh();return}const u=new Date().toISOString();persist({...x,status:t.value,updatedAt:u},false,{status:t.value,updatedAt:u});toast('Status diperbarui')}}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){const v=e.target.value.trim();clearTimeout(window._qt);window._qt=setTimeout(()=>{f.q=v;refresh()},150)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')tryShut();
  else if(e.key==='Enter'&&e.target.matches('tr[data-id]'))openDetail(e.target.dataset.id);
  else if(!e.target.matches('input,select,textarea')&&!document.querySelector('.mb.on')){if(e.key==='/'){e.preventDefault();const q=$('#q');q&&q.focus()}else if(e.key==='n'&&canWrite)openForm()}
});
$('#add').onclick=()=>openForm();$('#csv').onclick=exportCsv;$('#prn').onclick=()=>window.print();
$('#hb').onclick=()=>$('#side').classList.add('on');$('#scrim').onclick=()=>$('#side').classList.remove('on');
init();
